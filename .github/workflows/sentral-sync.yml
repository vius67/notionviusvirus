name: Sentral sync

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger sync
        run: |
          curl -sf -X GET "${{ secrets.SENTRAL_SYNC_URL }}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
